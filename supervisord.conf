[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xray]
command=/bin/bash -c "mkdir -p /var/log/xray && /opt/xray/xray run -config /etc/xray/config.json"
directory=/opt/xray
autostart=true
autorestart=true
startretries=10
user=root
priority=1
stdout_logfile=/var/log/xray/stdout.log
stderr_logfile=/var/log/xray/stderr.log
environment=HOME="/root",USER="root"

[program:nginx]
command=/bin/bash -c "mkdir -p /var/log/nginx && /usr/sbin/nginx -g 'daemon off;'"
autostart=true
autorestart=true
startretries=5
user=root
priority=5
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log

[program:panel]
command=/bin/bash -c "mkdir -p /var/log/panel && cd /app/panel && python3 -m uvicorn app:app --host 0.0.0.0 --port 8000"
directory=/app/panel
autostart=true
autorestart=true
startretries=10
user=root
priority=10
stdout_logfile=/var/log/panel/stdout.log
stderr_logfile=/var/log/panel/stderr.log
environment=PYTHONUNBUFFERED="1",PANEL_PORT="8000"

[group:edgex]
programs=xray,nginx,panel
priority=999
