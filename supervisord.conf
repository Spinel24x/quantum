[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xray]
command=/opt/xray/xray run -config /etc/xray/config.json
directory=/opt/xray
autostart=true
autorestart=true
startretries=3
user=root
priority=1
stdout_logfile=/var/log/xray/stdout.log
stderr_logfile=/var/log/xray/stderr.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
user=root
priority=5
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log

[program:panel]
command=python3 -m uvicorn app:app --host 0.0.0.0 --port 8000
directory=/app/panel
autostart=true
autorestart=true
startretries=3
user=root
priority=10
stdout_logfile=/var/log/panel/stdout.log
stderr_logfile=/var/log/panel/stderr.log
environment=PYTHONUNBUFFERED="1"

[group:edgex]
programs=xray,nginx,panel
priority=999
